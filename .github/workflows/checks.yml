name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: HTML + enlaces locales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: html-validate
        run: npm run check:html
      - name: Enlaces y recursos locales + a11y básica
        run: npm run check:links
      - name: Servir el sitio y verificar que todo responde 200
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fsI http://127.0.0.1:8000/index.html >/dev/null && break; sleep 0.5; done
          node scripts/check-site.mjs --base-url http://127.0.0.1:8000/

  external-links:
    name: Enlaces externos (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './**/*.html'
          fail: true

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
